name: Code quality checks
on: [push, pull_request]

jobs:
  check:
    name: Type validation, formatting, and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '>=3.14'
      - run: make install_deps
      - run: make install
      - run: make lint
